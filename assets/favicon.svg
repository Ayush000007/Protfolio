<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Radial chrome gradient for inflated background badge -->
    <radialGradient id="chromeBase" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F2F4F7" />
      <stop offset="35%" stop-color="#C9CDD3" />
      <stop offset="70%" stop-color="#3A3E47" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </radialGradient>
    
    <!-- Linear specular highlight -->
    <linearGradient id="chromeSpec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#C9CDD3" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#6B7078" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#121216" stop-opacity="1" />
    </linearGradient>

    <!-- Crimson laser rim glow -->
    <radialGradient id="crimsonGlow" cx="80%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#FF1A3C" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FF1A3C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FF1A3C" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark obsidian pill background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0A0A0C" stroke="#1E2026" stroke-width="2" />
  
  <!-- Subtle laser rim glow in bottom corner -->
  <circle cx="50" cy="50" r="18" fill="url(#crimsonGlow)" />

  <!-- Inflated Chrome Monogram "A" -->
  <path d="M32 10 L48 50 H39 L35 39 H29 L25 50 H16 Z M32 23 L30.2 31 H33.8 Z" 
        fill="url(#chromeBase)" 
        stroke="url(#chromeSpec)" 
        stroke-width="1.8" 
        stroke-linejoin="round"
        stroke-linecap="round" />

  <!-- Laser Crimson active beacon dot -->
  <circle cx="48" cy="16" r="3.2" fill="#FF1A3C" filter="url(#softGlow)" />
  <circle cx="48" cy="16" r="1.5" fill="#FFFFFF" />
</svg>
